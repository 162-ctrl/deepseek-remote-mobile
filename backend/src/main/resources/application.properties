spring.application.name=deepseek-remote-backend

# HTTP/WS port (override with SERVER_PORT)
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0

# M1 pairing code, shared by app and agent (protocol section 2.1)
m1.pairing-code=${M1_PAIRING_CODE:824613}
# M2.0: tokens are persisted in PostgreSQL (auth_tokens, sha256 only), so a paired
# client survives backend restarts (M2_DELTA section 1.3 / acceptance M2-A4).
m1.token-ttl-days=${M1_TOKEN_TTL_DAYS:30}
# Very short in-memory cache for burst accel; a revoked row is picked up within ~1s.
m1.token-cache-ttl-seconds=${M1_TOKEN_CACHE_TTL_SECONDS:1}
m1.version=0.1.1-m2

# ---------------------------------------------------------------------------
# M1.1 persistence (PostgreSQL 16, portable instance on 127.0.0.1:5433)
# Contract: docs/design/M1_1_DELTA.md section 2/6. Everything can be overridden
# with env vars so CI / tunnels can point at another database.
# ---------------------------------------------------------------------------
spring.datasource.url=${M1_DB_URL:jdbc:postgresql://127.0.0.1:5433/deepseek_remote}
spring.datasource.username=${M1_DB_USER:postgres}
spring.datasource.password=${M1_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${M1_DB_POOL_SIZE:8}
# Keep the client-side timeout short: persistence must never stall the relay.
spring.datasource.hikari.connection-timeout=3000

spring.flyway.enabled=${M1_DB_MIGRATE:true}
spring.flyway.locations=classpath:db/migration

# Persistence can be switched off (relay keeps working purely in memory).
m1.db.persist-enabled=${M1_DB_PERSIST:true}
# REST history defaults (M1.1 DELTA section 3).
m1.history.default-limit=50
m1.history.max-limit=200
# M2.1 catch-up endpoint (M2_1_DELTA section 3.1): default/explicit limit, max 500.
m1.events.default-limit=${M1_EVENTS_DEFAULT_LIMIT:200}
m1.events.max-limit=${M1_EVENTS_MAX_LIMIT:500}

# ---------------------------------------------------------------------------
# M2.5 app self-update (contract docs/design/M2_5_UPDATE_DELTA.md sections 2/B1-B3)
# GET /api/v1/app/version and GET /api/v1/app/apk are public (no Bearer).
# apk-path is relative to the backend working directory (bootRun cwd), or absolute.
# ---------------------------------------------------------------------------
app.update.enabled=${APP_UPDATE_ENABLED:true}
app.update.apk-path=${APP_UPDATE_APK_PATH:../dist/DeepSeek-Remote-latest.apk}
app.update.version-code=${APP_UPDATE_VERSION_CODE:8}
app.update.version-name=${APP_UPDATE_VERSION_NAME:0.1.7-m2.6}
app.update.notes=${APP_UPDATE_NOTES:\u9879\u76EE\u540C\u6B65\u7248\uFF1A\u624B\u673A\u6D4F\u89C8\u7535\u8111\u9879\u76EE\u6587\u4EF6\u3001\u9884\u89C8\u4EE3\u7801\u3001\u5728\u9879\u76EE\u76EE\u5F55\u91CC\u53D1\u6307\u4EE4}

logging.level.root=INFO
logging.level.com.deepseek.remote=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
